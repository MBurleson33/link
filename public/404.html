<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#2333E8">
<title>No link here · link33</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='16' fill='%232333E8'/><circle cx='32' cy='32' r='20' fill='%23FFD23F'/><text x='32' y='40' font-family='Arial Black,Arial,sans-serif' font-size='22' font-weight='900' fill='%2314163A' text-anchor='middle'>33</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,300..800&display=swap" rel="stylesheet">
<style>
  :root { --klein: #2333E8; --paper: #F6F7FB; --ink: #14163A; --sky: #B9C2FF; --signal: #FFD23F; }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: var(--klein); color: var(--paper);
    font-family: "Bricolage Grotesque", system-ui, sans-serif; font-variation-settings: "opsz" 16; }
  main { min-height: 100vh; max-width: 520px; margin: 0 auto; padding: 40px 26px;
    display: flex; flex-direction: column; justify-content: center; }
  .torn { position: relative; width: 200px; height: 110px; margin-bottom: 34px; }
  .torn .half { position: absolute; top: 0; height: 100%; background: var(--signal); }
  .torn .l { left: 0; width: 104px; border-radius: 8px 0 0 8px;
    clip-path: polygon(30px 0, 100% 0, 88% 18%, 100% 34%, 86% 52%, 100% 70%, 90% 86%, 100% 100%, 30px 100%, 0 70%, 0 30%); }
  .torn .r { left: 114px; width: 86px; border-radius: 0 18px 18px 0; transform: rotate(9deg) translate(6px, 8px);
    clip-path: polygon(12% 0, 100% 0, 100% 100%, 0 100%, 10% 86%, 0 70%, 14% 52%, 0 34%, 12% 18%, 0 0); }
  .torn .hole { position: absolute; left: 20px; top: 45px; width: 20px; height: 20px; border-radius: 50%;
    background: var(--klein); box-shadow: inset 0 0 0 4px rgba(20,22,58,.14); }
  h1 { margin: 0 0 12px; font-size: clamp(40px, 12vw, 60px); line-height: .98; font-weight: 800; letter-spacing: -.045em;
    font-variation-settings: "opsz" 96, "wdth" 75; }
  p { margin: 0; color: var(--sky); font-size: 18px; line-height: 1.5; max-width: 30em; }
  code { font-family: inherit; color: var(--paper); font-weight: 700; word-break: break-all; }
  .mark { margin-top: 48px; display: inline-flex; align-items: center; gap: .18em; font-size: 30px; line-height: 1; }
  .mark .word { font-weight: 800; letter-spacing: -.045em; font-variation-settings: "opsz" 96, "wdth" 75; }
  .mark .coin { display: inline-grid; place-items: center; min-width: 1.02em; height: 1.02em; padding: 0 .1em; border-radius: 999px;
    background: var(--signal); color: var(--ink); font-weight: 800; font-size: .54em; letter-spacing: -.06em;
    font-variation-settings: "opsz" 96, "wdth" 75; }
</style>
</head>
<body>
<main>
  <div class="torn" aria-hidden="true"><div class="half l"><span class="hole"></span></div><div class="half r"></div></div>
  <h1>This link doesn’t go anywhere</h1>
  <p id="msg">It may have been typed wrong or removed. Ask whoever sent it for a fresh one.</p>
  <span class="mark" aria-label="link33"><span class="word">link</span><span class="coin">33</span></span>
</main>
<script>
  const s = new URLSearchParams(location.search).get('s');
  if (s) {
    const msg = document.getElementById('msg');
    msg.textContent = 'There’s no link at ';
    const c = document.createElement('code'); c.textContent = location.host + '/' + s; msg.append(c);
    msg.append('. It may have been typed wrong or removed. Ask whoever sent it for a fresh one.');
  }
</script>
</body>
</html>
