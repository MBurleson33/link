<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0f1115">
<title>link33</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%235b8cff'/><text x='32' y='43' font-family='Arial,Helvetica,sans-serif' font-size='30' font-weight='800' fill='white' text-anchor='middle'>33</text></svg>">
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --panel-2: #1e222b; --line: #2a2f3a;
    --text: #e8eaf0; --muted: #8b93a7; --accent: #5b8cff; --accent-2: #3d6fe6;
    --danger: #ff5d6c; --ok: #3ccf91; --radius: 14px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif; }
  body { padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom); min-height: 100vh; }
  .wrap { max-width: 720px; margin: 0 auto; padding: 24px 18px 60px; }
  header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 22px; }
  h1 { font-size: 22px; margin: 0; letter-spacing: -.01em; }
  h1 span { color: var(--muted); font-weight: 500; font-size: 14px; display: block; margin-top: 2px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; }
  label { display: block; font-size: 13px; color: var(--muted); margin: 0 0 6px; font-weight: 600; }
  input { width: 100%; background: var(--panel-2); color: var(--text); border: 1px solid var(--line);
    border-radius: 10px; padding: 12px 14px; font-size: 16px; outline: none; transition: border-color .15s; }
  input:focus { border-color: var(--accent); }
  .field { margin-bottom: 14px; }
  .slug-row { display: flex; align-items: stretch; background: var(--panel-2); border: 1px solid var(--line);
    border-radius: 10px; overflow: hidden; }
  .slug-row:focus-within { border-color: var(--accent); }
  .slug-row .prefix { padding: 12px 0 12px 14px; color: var(--muted); white-space: nowrap; font-size: 15px;
    display: flex; align-items: center; max-width: 55%; overflow: hidden; text-overflow: ellipsis; }
  .slug-row input { border: 0; padding-left: 2px; background: transparent; }
  .hint { font-size: 12px; color: var(--muted); margin-top: 6px; }
  button { font: inherit; cursor: pointer; border: 0; border-radius: 10px; padding: 12px 16px; font-weight: 600;
    background: var(--panel-2); color: var(--text); border: 1px solid var(--line); transition: background .15s, transform .05s; }
  button:active { transform: scale(.98); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; width: 100%; }
  button.primary:hover { background: var(--accent-2); }
  button.danger { background: var(--danger); border-color: var(--danger); color: #fff; }
  button.ghost { background: transparent; }
  button.sm { padding: 7px 11px; font-size: 13px; border-radius: 8px; }
  button:disabled { opacity: .55; cursor: default; }
  .error { color: var(--danger); font-size: 14px; margin-top: 10px; min-height: 1px; }

  .result { margin-top: 16px; display: none; background: var(--panel-2); border: 1px solid var(--line);
    border-radius: 12px; padding: 14px; }
  .result.show { display: block; animation: pop .2s ease-out; }
  .result .short { font-size: 18px; font-weight: 700; color: var(--accent); word-break: break-all; }
  .result .actions { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }

  .list-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 28px 0 12px; }
  .list-head h2 { font-size: 17px; margin: 0; }
  .list-head input { max-width: 220px; padding: 9px 12px; font-size: 14px; }
  .link { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px; margin-bottom: 10px; }
  .link-top { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
  .link .slug { font-weight: 700; color: var(--text); word-break: break-all; }
  .link .clicks { font-size: 13px; color: var(--muted); white-space: nowrap; }
  .link .clicks b { color: var(--ok); font-weight: 700; }
  .link .dest { font-size: 13px; color: var(--muted); margin-top: 4px; word-break: break-all;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .link .row-actions { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
  .empty { text-align: center; color: var(--muted); padding: 30px 10px; }

  /* Login */
  .login { max-width: 380px; margin: 14vh auto 0; }
  .login h1 { margin-bottom: 18px; text-align: center; }
  .login .brand { justify-content: center; }

  /* Custom dialog */
  .overlay { position: fixed; inset: 0; background: rgba(5,6,10,.65); backdrop-filter: blur(4px);
    display: none; align-items: center; justify-content: center; padding: 20px; z-index: 50; }
  .overlay.show { display: flex; animation: fade .15s ease-out; }
  .dialog { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 20px;
    width: 100%; max-width: 400px; animation: pop .18s ease-out; }
  .dialog h3 { margin: 0 0 8px; font-size: 18px; }
  .dialog p { margin: 0 0 16px; color: var(--muted); font-size: 15px; word-break: break-word; }
  .dialog .btns { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }
  .qr-box { background: #fff; border-radius: 12px; padding: 14px; display: flex; justify-content: center; }
  .qr-box img { width: 100%; max-width: 240px; image-rendering: pixelated; }

  /* Toast */
  .toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom)); transform: translateX(-50%) translateY(20px);
    background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 999px; font-weight: 600; font-size: 14px;
    opacity: 0; pointer-events: none; transition: all .2s; z-index: 60; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  @keyframes pop { from { transform: scale(.96); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }

  .brand { display: inline-flex; align-items: center; gap: 10px; font-weight: 800; letter-spacing: -.02em; }
  .brand .mark { width: 34px; height: 34px; border-radius: 9px; background: var(--accent); color: #fff;
    display: inline-flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 800; }
  .brand .word { font-size: 22px; color: var(--text); }
  .brand .word b { color: var(--accent); font-weight: 800; }
  .hidden { display: none !important; }
</style>
</head>
<body>

<!-- Login -->
<div id="loginView" class="wrap hidden">
  <div class="login card">
    <h1><span class="brand"><span class="mark">33</span><span class="word">link<b>33</b></span></span></h1>
    <form id="loginForm">
      <div class="field">
        <label for="pw">Password</label>
        <input id="pw" type="password" autocomplete="current-password" required>
      </div>
      <button class="primary" type="submit">Unlock</button>
      <div class="error" id="loginError"></div>
    </form>
  </div>
</div>

<!-- App -->
<div id="appView" class="wrap hidden">
  <header>
    <h1><span class="brand"><span class="mark">33</span><span class="word">link<b>33</b></span></span></h1>
    <button class="ghost sm" id="logoutBtn">Lock</button>
  </header>

  <form id="createForm" class="card" autocomplete="off">
    <div class="field">
      <label for="url">Long URL</label>
      <input id="url" type="text" inputmode="url" placeholder="https://example.com/a/really/long/link" required>
    </div>
    <div class="field">
      <label for="slug">Custom slug <span style="font-weight:400">(optional)</span></label>
      <div class="slug-row">
        <span class="prefix" id="slugPrefix"></span>
        <input id="slug" type="text" placeholder="spring-sale" autocapitalize="off" spellcheck="false">
      </div>
      <div class="hint">Leave blank for a random one. Letters, numbers, - and _.</div>
    </div>
    <button class="primary" type="submit" id="createBtn">Shorten</button>
    <div class="error" id="createError"></div>

    <div class="result" id="result">
      <div class="short" id="resultUrl"></div>
      <div class="actions">
        <button type="button" class="sm" id="resultCopy">Copy</button>
        <button type="button" class="sm" id="resultQr">QR code</button>
        <button type="button" class="sm" id="resultShare">Share</button>
      </div>
    </div>
  </form>

  <div class="list-head">
    <h2 id="listTitle">Your links</h2>
    <input id="search" type="search" placeholder="Search…">
  </div>
  <div id="list"></div>
</div>

<!-- Dialog -->
<div class="overlay" id="overlay">
  <div class="dialog" role="dialog" aria-modal="true">
    <h3 id="dlgTitle"></h3>
    <p id="dlgText"></p>
    <div id="dlgBody"></div>
    <div class="btns" id="dlgBtns"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const ORIGIN = location.origin;
  const HOST = location.host;
  let KEY = '';
  let links = [];
  let lastShort = '';

  // ---------- storage (wrapped: can fail in private modes) ----------
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch {} },
    del(k) { try { localStorage.removeItem(k); } catch {} },
  };

  // ---------- toast ----------
  let toastTimer;
  function toast(msg) {
    const t = $('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 1800);
  }

  // ---------- custom dialog (no native alert/confirm/prompt) ----------
  function dialog({ title, text = '', body = null, buttons }) {
    return new Promise((resolve) => {
      $('dlgTitle').textContent = title;
      $('dlgText').textContent = text;
      $('dlgText').classList.toggle('hidden', !text);
      const bodyEl = $('dlgBody');
      bodyEl.innerHTML = '';
      if (body) bodyEl.appendChild(body);
      const btns = $('dlgBtns');
      btns.innerHTML = '';
      const close = (val) => {
        $('overlay').classList.remove('show');
        document.removeEventListener('keydown', onKey);
        resolve(val);
      };
      const onKey = (e) => { if (e.key === 'Escape') close(null); };
      buttons.forEach((b) => {
        const el = document.createElement('button');
        el.textContent = b.label;
        el.className = 'sm ' + (b.cls || '');
        el.onclick = () => close(typeof b.value === 'function' ? b.value() : b.value);
        btns.appendChild(el);
      });
      $('overlay').onclick = (e) => { if (e.target.id === 'overlay') close(null); };
      document.addEventListener('keydown', onKey);
      $('overlay').classList.add('show');
      const input = bodyEl.querySelector('input');
      if (input) setTimeout(() => input.focus(), 50);
    });
  }

  // ---------- API ----------
  async function api(method, path, body) {
    const res = await fetch(path, {
      method,
      headers: { 'x-admin-key': KEY, ...(body ? { 'Content-Type': 'application/json' } : {}) },
      body: body ? JSON.stringify(body) : undefined,
    });
    let data = {};
    try { data = await res.json(); } catch {}
    if (!res.ok) { const e = new Error(data.error || 'Request failed'); e.status = res.status; e.data = data; throw e; }
    return data;
  }

  // ---------- helpers ----------
  const shortUrl = (slug) => `${ORIGIN}/${slug}`;
  const prettyShort = (slug) => `${HOST}/${slug}`;

  async function copy(text) {
    try { await navigator.clipboard.writeText(text); toast('Copied'); }
    catch {
      const ta = document.createElement('textarea');
      ta.value = text; document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); toast('Copied'); } catch { toast('Couldn’t copy'); }
      ta.remove();
    }
  }

  async function share(slug) {
    const url = shortUrl(slug);
    if (navigator.share) { try { await navigator.share({ url }); } catch {} }
    else copy(url);
  }

  function showQr(slug) {
    const url = shortUrl(slug);
    const box = document.createElement('div');
    box.className = 'qr-box';
    const qr = qrcode(0, 'M');
    qr.addData(url); qr.make();
    const dataUrl = qr.createDataURL(10, 2);
    const img = document.createElement('img');
    img.src = dataUrl; img.alt = 'QR code for ' + url;
    box.appendChild(img);
    dialog({
      title: 'QR code', text: prettyShort(slug), body: box,
      buttons: [
        { label: 'Download', value: () => {
          const a = document.createElement('a'); a.href = dataUrl; a.download = `qr-${slug}.gif`; a.click(); return null;
        } },
        { label: 'Done', cls: 'primary', value: null },
      ],
    });
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
  }

  // ---------- render ----------
  function render() {
    const q = $('search').value.trim().toLowerCase();
    const shown = links.filter((l) => !q || l.slug.includes(q) || l.url.toLowerCase().includes(q));
    $('listTitle').textContent = `Your links (${links.length})`;
    if (!shown.length) {
      $('list').innerHTML = `<div class="empty">${links.length ? 'No matches.' : 'No links yet — make your first one above.'}</div>`;
      return;
    }
    $('list').innerHTML = shown.map((l) => `
      <div class="link" data-slug="${escapeHtml(l.slug)}">
        <div class="link-top">
          <div class="slug">/${escapeHtml(l.slug)}</div>
          <div class="clicks"><b>${l.clicks}</b> click${l.clicks === 1 ? '' : 's'}</div>
        </div>
        <div class="dest">${escapeHtml(l.url)}</div>
        <div class="row-actions">
          <button class="sm" data-act="copy">Copy</button>
          <button class="sm" data-act="qr">QR</button>
          <button class="sm" data-act="edit">Edit</button>
          <button class="sm ghost" data-act="delete" style="color:var(--danger)">Delete</button>
        </div>
      </div>`).join('');
  }

  async function load() {
    const data = await api('GET', '/api/links');
    links = data.links;
    render();
  }

  // ---------- actions ----------
  async function editLink(slug) {
    const link = links.find((l) => l.slug === slug);
    const wrap = document.createElement('div');
    wrap.innerHTML = `<label>Destination URL</label><input type="text" inputmode="url">`;
    const input = wrap.querySelector('input');
    input.value = link.url;
    input.addEventListener('keydown', (e) => { if (e.key === 'Enter') $('dlgBtns').lastChild.click(); });
    const val = await dialog({
      title: `Edit /${slug}`, body: wrap,
      buttons: [{ label: 'Cancel', value: null }, { label: 'Save', cls: 'primary', value: () => input.value }],
    });
    if (val == null) return;
    try {
      await api('POST', '/api/links', { url: val, slug, overwrite: true });
      toast('Saved'); await load();
    } catch (e) { toast(e.message); }
  }

  async function deleteLink(slug) {
    const ok = await dialog({
      title: `Delete /${slug}?`,
      text: 'Anyone who clicks this link will get a "not found" page. This can’t be undone.',
      buttons: [{ label: 'Cancel', value: false }, { label: 'Delete', cls: 'danger', value: true }],
    });
    if (!ok) return;
    try { await api('DELETE', `/api/links?slug=${encodeURIComponent(slug)}`); toast('Deleted'); await load(); }
    catch (e) { toast(e.message); }
  }

  $('list').addEventListener('click', (e) => {
    const btn = e.target.closest('button[data-act]');
    if (!btn) return;
    const slug = btn.closest('.link').dataset.slug;
    ({ copy: () => copy(shortUrl(slug)), qr: () => showQr(slug), edit: () => editLink(slug), delete: () => deleteLink(slug) })[btn.dataset.act]();
  });

  $('search').addEventListener('input', render);

  $('createForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    $('createError').textContent = '';
    const btn = $('createBtn');
    btn.disabled = true; btn.textContent = 'Shortening…';
    const payload = { url: $('url').value, slug: $('slug').value };
    try {
      let data;
      try {
        data = await api('POST', '/api/links', payload);
      } catch (err) {
        if (err.status !== 409) throw err;
        const replace = await dialog({
          title: 'Slug already taken',
          text: `/${err.data.slug} already points somewhere else. Replace it with this URL?`,
          buttons: [{ label: 'Cancel', value: false }, { label: 'Replace', cls: 'danger', value: true }],
        });
        if (!replace) return;
        data = await api('POST', '/api/links', { ...payload, overwrite: true });
      }
      lastShort = data.slug;
      $('resultUrl').textContent = prettyShort(data.slug);
      $('result').classList.add('show');
      $('url').value = ''; $('slug').value = '';
      copy(shortUrl(data.slug));
      await load();
    } catch (err) {
      $('createError').textContent = err.message;
    } finally {
      btn.disabled = false; btn.textContent = 'Shorten';
    }
  });

  $('resultCopy').onclick = () => copy(shortUrl(lastShort));
  $('resultQr').onclick = () => showQr(lastShort);
  $('resultShare').onclick = () => share(lastShort);

  // ---------- auth ----------
  function showApp() {
    $('loginView').classList.add('hidden');
    $('appView').classList.remove('hidden');
    $('slugPrefix').textContent = HOST + '/';
  }
  function showLogin(msg = '') {
    $('appView').classList.add('hidden');
    $('loginView').classList.remove('hidden');
    $('loginError').textContent = msg;
    setTimeout(() => $('pw').focus(), 50);
  }

  async function tryKey(key) {
    KEY = key;
    try { await load(); store.set('sl_key', key); showApp(); return true; }
    catch (e) {
      KEY = '';
      if (e.status === 401) { store.del('sl_key'); showLogin(key ? 'Wrong password' : ''); }
      else showLogin(e.message);
      return false;
    }
  }

  $('loginForm').addEventListener('submit', (e) => { e.preventDefault(); tryKey($('pw').value); });
  $('logoutBtn').onclick = () => { store.del('sl_key'); KEY = ''; $('pw').value = ''; showLogin(); };

  const saved = store.get('sl_key');
  if (saved) tryKey(saved); else showLogin();
})();
</script>
</body>
</html>
