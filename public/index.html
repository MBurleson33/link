<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#2333E8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="link33">
<title>link33</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='16' fill='%232333E8'/><circle cx='32' cy='32' r='20' fill='%23FFD23F'/><text x='32' y='40' font-family='Arial Black,Arial,sans-serif' font-size='22' font-weight='900' fill='%2314163A' text-anchor='middle'>33</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,300..800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
<style>
  :root {
    --klein: #2333E8;
    --klein-deep: #1A27C2;
    --paper: #F6F7FB;
    --ink: #14163A;
    --ink-soft: #5A5F86;
    --sky: #B9C2FF;
    --signal: #FFD23F;
    --rose: #FF5A6E;
    --line: rgba(185, 194, 255, .28);
    --font: "Bricolage Grotesque", system-ui, sans-serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { background: var(--klein); }
  body {
    margin: 0; min-height: 100vh; color: var(--paper); background: var(--klein);
    font-family: var(--font); font-size: 17px; line-height: 1.45;
    font-variation-settings: "opsz" 16;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  .wrap { max-width: 560px; margin: 0 auto; padding: 22px 20px 80px; }
  .hidden { display: none !important; }
  button, input { font: inherit; color: inherit; }
  :focus-visible { outline: 3px solid var(--signal); outline-offset: 3px; border-radius: 6px; }

  /* ---------- Wordmark ---------- */
  .mark { display: inline-flex; align-items: center; gap: .18em; text-decoration: none; color: var(--paper); line-height: 1; }
  .mark .word {
    font-weight: 800; letter-spacing: -.045em;
    font-variation-settings: "opsz" 96, "wdth" 75;
  }
  .mark .coin {
    display: inline-grid; place-items: center; min-width: 1.02em; height: 1.02em; padding: 0 .1em; border-radius: 999px;
    background: var(--signal); color: var(--ink); font-weight: 800; font-size: .54em;
    letter-spacing: -.06em; font-variation-settings: "opsz" 96, "wdth" 75;
    transform: translateY(.04em);
  }
  .topbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 26px; }
  .topbar .mark { font-size: 44px; }
  .lock {
    background: none; border: 1.5px solid var(--line); color: var(--sky); border-radius: 999px;
    padding: 7px 14px; font-size: 14px; font-weight: 600; cursor: pointer;
  }
  .lock:hover { color: var(--paper); border-color: var(--sky); }

  /* ---------- Sheet (form) ---------- */
  .sheet {
    background: var(--paper); color: var(--ink); border-radius: 26px; padding: 22px 20px 20px;
    box-shadow: 0 30px 60px -30px rgba(10, 14, 90, .6);
  }
  .sheet h1 {
    margin: 0 0 18px; font-size: 28px; line-height: 1.05; font-weight: 800; letter-spacing: -.03em;
    font-variation-settings: "opsz" 96, "wdth" 82;
  }
  .field { margin-bottom: 16px; }
  .field label { display: block; font-size: 14px; font-weight: 600; color: var(--ink-soft); margin-bottom: 7px; }
  .input, .slugbox {
    width: 100%; background: #fff; border: 2px solid #DFE2F2; border-radius: 14px;
    transition: border-color .15s;
  }
  .input { padding: 14px 15px; font-size: 17px; color: var(--ink); outline: none; }
  .input::placeholder, .slugbox input::placeholder { color: #A3A8C8; }
  .input:focus, .slugbox:focus-within { border-color: var(--klein); }
  .slugbox { display: flex; align-items: center; overflow: hidden; }
  .slugbox .host {
    padding: 14px 0 14px 15px; color: var(--ink-soft); white-space: nowrap; font-size: 16px;
    max-width: 62%; overflow: hidden; text-overflow: ellipsis;
  }
  .slugbox input {
    flex: 1; min-width: 0; border: 0; outline: none; background: transparent; padding: 14px 15px 14px 1px;
    font-size: 17px; font-weight: 700; color: var(--klein);
  }
  .field .hint { font-size: 13px; color: var(--ink-soft); margin-top: 7px; }
  .go {
    width: 100%; border: 0; border-radius: 16px; padding: 16px; margin-top: 4px; cursor: pointer;
    background: var(--ink); color: var(--paper); font-size: 18px; font-weight: 700; letter-spacing: -.01em;
    transition: transform .08s, background .15s;
  }
  .go:hover { background: #23265A; }
  .go:active { transform: scale(.985); }
  .go:disabled { opacity: .6; cursor: default; }
  .err { color: #D6243A; font-size: 14px; font-weight: 600; margin-top: 12px; }
  .err:empty { display: none; }

  /* ---------- The tag (the one loud thing) ---------- */
  .tagzone { margin: 30px 0 6px; display: none; }
  .tagzone.show { display: block; }
  .tag {
    position: relative; background: var(--signal); color: var(--ink);
    padding: 22px 22px 18px 74px; border-radius: 10px 22px 22px 10px;
    clip-path: polygon(34px 0, 100% 0, 100% 100%, 34px 100%, 0 calc(100% - 34px), 0 34px);
    transform-origin: 30px 50%;
  }
  .tagzone.show .tag { animation: swing .7s cubic-bezier(.3, 1.6, .5, 1); }
  .tag::before { /* punched hole */
    content: ""; position: absolute; left: 22px; top: 50%; width: 20px; height: 20px; margin-top: -10px;
    border-radius: 50%; background: var(--klein); box-shadow: inset 0 0 0 4px rgba(20, 22, 58, .14);
  }
  .tag .host { font-size: 14px; font-weight: 600; color: rgba(20, 22, 58, .62); }
  .tag .slug {
    display: block; font-size: clamp(34px, 11vw, 54px); line-height: .98; font-weight: 800;
    letter-spacing: -.045em; font-variation-settings: "opsz" 96, "wdth" 75; word-break: break-all;
    margin: 2px 0 14px;
  }
  .tag .dest { font-size: 13px; color: rgba(20, 22, 58, .7); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-bottom: 14px; }
  .tag .acts { display: flex; gap: 8px; flex-wrap: wrap; }
  .tag .acts button {
    border: 0; border-radius: 999px; padding: 9px 15px; font-size: 14px; font-weight: 700; cursor: pointer;
    background: var(--ink); color: var(--signal);
  }
  .tag .acts button.alt { background: rgba(20, 22, 58, .1); color: var(--ink); }
  @keyframes swing {
    0% { transform: rotate(-9deg) translateY(-14px); opacity: 0; }
    40% { opacity: 1; }
    100% { transform: none; }
  }

  /* ---------- Link list ---------- */
  .listhead { display: flex; align-items: baseline; justify-content: space-between; gap: 14px; margin: 40px 0 6px; }
  .listhead h2 {
    margin: 0; font-size: 24px; font-weight: 800; letter-spacing: -.03em; font-variation-settings: "opsz" 96, "wdth" 82;
  }
  .listhead .count { color: var(--sky); font-size: 15px; font-weight: 500; }
  .search {
    width: 100%; margin: 12px 0 4px; background: rgba(255, 255, 255, .08); border: 1.5px solid var(--line);
    border-radius: 12px; padding: 11px 14px; font-size: 16px; color: var(--paper); outline: none;
  }
  .search::placeholder { color: var(--sky); opacity: .8; }
  .search:focus { border-color: var(--sky); background: rgba(255, 255, 255, .12); }

  .rows { list-style: none; margin: 8px 0 0; padding: 0; }
  .row {
    display: grid; grid-template-columns: 1fr auto; gap: 4px 16px; align-items: center;
    padding: 16px 2px; border-bottom: 1px solid var(--line); cursor: pointer;
  }
  .row:first-child { border-top: 1px solid var(--line); }
  .row:hover .r-slug { color: var(--signal); }
  .r-slug {
    font-size: 22px; font-weight: 800; letter-spacing: -.035em; line-height: 1.1; word-break: break-all;
    font-variation-settings: "opsz" 96, "wdth" 80; transition: color .12s;
  }
  .r-slug span { color: var(--sky); font-weight: 500; }
  .r-dest { grid-column: 1; font-size: 14px; color: var(--sky); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .r-clicks { grid-row: 1 / span 2; grid-column: 2; text-align: right; line-height: 1; }
  .r-clicks b {
    display: block; font-size: 28px; font-weight: 800; letter-spacing: -.04em; font-variation-settings: "opsz" 96, "wdth" 75;
  }
  .r-clicks small { font-size: 12px; color: var(--sky); }
  .empty { padding: 34px 4px; color: var(--sky); font-size: 16px; border-top: 1px solid var(--line); }
  .empty b { color: var(--paper); display: block; font-size: 19px; margin-bottom: 4px; }

  /* ---------- Login ---------- */
  .login { min-height: calc(100vh - 40px); display: flex; flex-direction: column; justify-content: center; padding: 30px 24px; max-width: 460px; margin: 0 auto; }
  .login .mark { font-size: clamp(76px, 26vw, 120px); margin-bottom: 14px; }
  .login p { color: var(--sky); margin: 0 0 28px; font-size: 18px; }
  .login .input { background: rgba(255, 255, 255, .1); border-color: var(--line); color: var(--paper); }
  .login .input::placeholder { color: var(--sky); }
  .login .input:focus { border-color: var(--signal); }
  .login .go { background: var(--signal); color: var(--ink); margin-top: 12px; }
  .login .go:hover { background: #FFDC63; }
  .login .err { color: var(--signal); }

  /* ---------- Bottom sheet + dialog ---------- */
  .scrim {
    position: fixed; inset: 0; background: rgba(8, 10, 50, .55); z-index: 40; display: none;
    align-items: flex-end; justify-content: center;
  }
  .scrim.show { display: flex; animation: fade .18s ease-out; }
  .scrim.center { align-items: center; padding: 20px; }
  .panel {
    width: 100%; max-width: 560px; background: var(--paper); color: var(--ink);
    border-radius: 26px 26px 0 0; padding: 10px 20px calc(20px + env(safe-area-inset-bottom));
    animation: rise .26s cubic-bezier(.2, .9, .3, 1);
  }
  .scrim.center .panel { border-radius: 24px; max-width: 400px; padding: 22px 20px 18px; animation: pop .2s ease-out; }
  .grab { width: 40px; height: 5px; border-radius: 3px; background: #D5D8EA; margin: 0 auto 16px; }
  .scrim.center .grab { display: none; }
  .panel h3 {
    margin: 0 0 4px; font-size: 24px; font-weight: 800; letter-spacing: -.035em; word-break: break-all;
    font-variation-settings: "opsz" 96, "wdth" 80;
  }
  .panel .sub { margin: 0 0 18px; color: var(--ink-soft); font-size: 15px; overflow-wrap: anywhere; }
  .menu { display: grid; gap: 8px; }
  .menu button {
    display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; cursor: pointer;
    background: #fff; border: 2px solid #E6E8F4; border-radius: 14px; padding: 14px 16px; font-size: 17px; font-weight: 600;
  }
  .menu button:hover { border-color: var(--klein); }
  .menu button svg { width: 20px; height: 20px; flex: none; stroke: var(--klein); }
  .menu button.danger { color: #D6243A; }
  .menu button.danger svg { stroke: #D6243A; }
  .btns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 18px; }
  .btn { border: 0; border-radius: 12px; padding: 12px 18px; font-size: 16px; font-weight: 700; cursor: pointer; background: #E6E8F4; color: var(--ink); }
  .btn.primary { background: var(--ink); color: var(--paper); }
  .btn.danger { background: var(--rose); color: #fff; }
  .qr { background: #fff; border-radius: 18px; padding: 16px; display: grid; place-items: center; border: 2px solid #E6E8F4; }
  .qr img { width: 100%; max-width: 250px; image-rendering: pixelated; }

  /* ---------- Toast ---------- */
  .toast {
    position: fixed; left: 50%; bottom: calc(26px + env(safe-area-inset-bottom)); z-index: 60;
    transform: translate(-50%, 16px); opacity: 0; pointer-events: none; transition: all .22s;
    background: var(--signal); color: var(--ink); font-weight: 700; font-size: 15px; padding: 11px 18px; border-radius: 999px; white-space: nowrap;
    box-shadow: 0 12px 30px -10px rgba(8, 10, 50, .6);
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  @keyframes fade { from { opacity: 0; } }
  @keyframes rise { from { transform: translateY(100%); } }
  @keyframes pop { from { transform: scale(.95); opacity: 0; } }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
  @media (min-width: 640px) {
    .wrap { padding-top: 48px; }
    .topbar .mark { font-size: 56px; }
    .sheet { padding: 28px 28px 26px; }
  }
</style>
</head>
<body>

<!-- Login -->
<main id="loginView" class="login hidden">
  <span class="mark" aria-label="link33"><span class="word">link</span><span class="coin">33</span></span>
  <p>Matt’s short links.</p>
  <form id="loginForm">
    <label for="pw" class="hidden">Password</label>
    <input id="pw" class="input" type="password" placeholder="Password" autocomplete="current-password" required>
    <button class="go" type="submit">Unlock</button>
    <div class="err" id="loginError"></div>
  </form>
</main>

<!-- App -->
<div id="appView" class="wrap hidden">
  <div class="topbar">
    <span class="mark" aria-label="link33"><span class="word">link</span><span class="coin">33</span></span>
    <button class="lock" id="logoutBtn">Lock</button>
  </div>

  <form id="createForm" class="sheet" autocomplete="off">
    <h1>Shorten a link</h1>
    <div class="field">
      <label for="url">Long link</label>
      <input id="url" class="input" type="text" inputmode="url" placeholder="Paste it here" required>
    </div>
    <div class="field">
      <label for="slug">Short link</label>
      <div class="slugbox">
        <span class="host" id="slugHost"></span>
        <input id="slug" type="text" placeholder="anything-you-want" autocapitalize="off" spellcheck="false">
      </div>
      <div class="hint">Leave it blank and link33 picks one for you.</div>
    </div>
    <button class="go" type="submit" id="createBtn">Shorten</button>
    <div class="err" id="createError"></div>
  </form>

  <div class="tagzone" id="tagzone" aria-live="polite">
    <div class="tag">
      <span class="host" id="tagHost"></span>
      <span class="slug" id="tagSlug"></span>
      <div class="dest" id="tagDest"></div>
      <div class="acts">
        <button type="button" id="tagCopy">Copy</button>
        <button type="button" class="alt" id="tagShare">Share</button>
        <button type="button" class="alt" id="tagQr">QR code</button>
      </div>
    </div>
  </div>

  <div class="listhead">
    <h2>Your links</h2>
    <span class="count" id="count"></span>
  </div>
  <input id="search" class="search hidden" type="search" placeholder="Search your links">
  <ul class="rows" id="rows"></ul>
</div>

<!-- Sheet / dialog host -->
<div class="scrim" id="scrim">
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="pTitle">
    <div class="grab"></div>
    <h3 id="pTitle"></h3>
    <p class="sub" id="pSub"></p>
    <div id="pBody"></div>
    <div class="btns" id="pBtns"></div>
  </div>
</div>

<div class="toast" id="toast" role="status"></div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const ORIGIN = location.origin;
  const HOST = location.host;
  let KEY = '';
  let links = [];
  let current = null; // last created slug

  const ICON = {
    copy: '<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>',
    share: '<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v13M7 8l5-5 5 5"/><path d="M5 14v5a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-5"/></svg>',
    qr: '<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><path d="M14 14h3v3M21 14v7h-7"/></svg>',
    open: '<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h6v6M20 4l-9 9"/><path d="M19 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1h5"/></svg>',
    edit: '<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16v4z"/></svg>',
    del: '<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>',
  };

  // ---------- storage (wrapped) ----------
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch {} },
    del(k) { try { localStorage.removeItem(k); } catch {} },
  };

  // ---------- toast ----------
  let tt;
  function toast(msg) {
    const t = $('toast'); t.textContent = msg; t.classList.add('show');
    clearTimeout(tt); tt = setTimeout(() => t.classList.remove('show'), 1800);
  }

  // ---------- panel: bottom sheet or centered dialog ----------
  let closePanel = null;
  function panel({ title, sub = '', body = null, buttons = [], center = false }) {
    return new Promise((resolve) => {
      const scrim = $('scrim');
      $('pTitle').textContent = title;
      $('pSub').textContent = sub; $('pSub').classList.toggle('hidden', !sub);
      const b = $('pBody'); b.innerHTML = ''; if (body) b.appendChild(body);
      const bt = $('pBtns'); bt.innerHTML = ''; bt.classList.toggle('hidden', !buttons.length);
      const done = (v) => {
        scrim.classList.remove('show'); document.removeEventListener('keydown', onKey); closePanel = null; resolve(v);
      };
      closePanel = done;
      const onKey = (e) => { if (e.key === 'Escape') done(null); };
      buttons.forEach((x) => {
        const el = document.createElement('button');
        el.className = 'btn ' + (x.cls || ''); el.textContent = x.label;
        el.onclick = () => done(typeof x.value === 'function' ? x.value() : x.value);
        bt.appendChild(el);
      });
      scrim.classList.toggle('center', center);
      scrim.onclick = (e) => { if (e.target === scrim) done(null); };
      document.addEventListener('keydown', onKey);
      scrim.classList.add('show');
      const focusEl = b.querySelector('input') || b.querySelector('button') || bt.lastChild;
      if (focusEl) setTimeout(() => focusEl.focus(), 60);
    });
  }

  // ---------- API ----------
  async function api(method, path, body) {
    const res = await fetch(path, {
      method,
      headers: { 'x-admin-key': KEY, ...(body ? { 'Content-Type': 'application/json' } : {}) },
      body: body ? JSON.stringify(body) : undefined,
    });
    let data = {}; try { data = await res.json(); } catch {}
    if (!res.ok) { const e = new Error(data.error || 'Something went wrong. Try again.'); e.status = res.status; e.data = data; throw e; }
    return data;
  }

  // ---------- helpers ----------
  const full = (slug) => `${ORIGIN}/${slug}`;
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const bare = (u) => u.replace(/^https?:\/\/(www\.)?/, '');

  async function copy(text, msg = 'Copied') {
    try { await navigator.clipboard.writeText(text); toast(msg); }
    catch {
      const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); toast(msg); } catch { toast('Couldn’t copy — long-press to copy instead'); }
      ta.remove();
    }
  }
  async function share(slug) {
    if (navigator.share) { try { await navigator.share({ url: full(slug) }); } catch {} }
    else copy(full(slug));
  }
  function qrFor(slug) {
    const box = document.createElement('div'); box.className = 'qr';
    const q = qrcode(0, 'M'); q.addData(full(slug)); q.make();
    const src = q.createDataURL(10, 2);
    const img = document.createElement('img'); img.src = src; img.alt = 'QR code for ' + full(slug);
    box.appendChild(img);
    panel({
      title: '/' + slug, sub: 'Scan to open ' + HOST + '/' + slug, body: box,
      buttons: [
        { label: 'Download', value: () => { const a = document.createElement('a'); a.href = src; a.download = `link33-${slug}.gif`; a.click(); return null; } },
        { label: 'Done', cls: 'primary', value: null },
      ],
    });
  }

  // ---------- render list ----------
  function render() {
    const q = $('search').value.trim().toLowerCase();
    const shown = links.filter((l) => !q || l.slug.includes(q) || l.url.toLowerCase().includes(q));
    $('count').textContent = links.length ? `${links.length} link${links.length === 1 ? '' : 's'}` : '';
    $('search').classList.toggle('hidden', links.length < 6);
    if (!links.length) {
      $('rows').innerHTML = `<li class="empty"><b>Nothing here yet</b>Shorten a link above and it’ll show up here with its click count.</li>`;
      return;
    }
    if (!shown.length) { $('rows').innerHTML = `<li class="empty">No links match “${esc(q)}”.</li>`; return; }
    $('rows').innerHTML = shown.map((l) => `
      <li class="row" tabindex="0" data-slug="${esc(l.slug)}">
        <div class="r-slug"><span>/</span>${esc(l.slug)}</div>
        <div class="r-dest">${esc(bare(l.url))}</div>
        <div class="r-clicks"><b>${l.clicks}</b><small>click${l.clicks === 1 ? '' : 's'}</small></div>
      </li>`).join('');
  }

  async function load() { const d = await api('GET', '/api/links'); links = d.links; render(); }

  // ---------- row actions ----------
  function rowMenu(slug) {
    const l = links.find((x) => x.slug === slug); if (!l) return;
    const menu = document.createElement('div'); menu.className = 'menu';
    const items = [
      ['copy', 'Copy short link', () => { closePanel(); copy(full(slug)); }],
      ['share', 'Share', () => { closePanel(); share(slug); }],
      ['qr', 'QR code', () => { closePanel(); setTimeout(() => qrFor(slug), 60); }],
      ['open', 'Open destination', () => { closePanel(); window.open(l.url, '_blank', 'noopener'); }],
      ['edit', 'Change destination', () => { closePanel(); setTimeout(() => editLink(slug), 60); }],
      ['del', 'Delete link', () => { closePanel(); setTimeout(() => deleteLink(slug), 60); }, 'danger'],
    ];
    items.forEach(([ic, label, fn, cls]) => {
      const b = document.createElement('button'); b.type = 'button'; if (cls) b.className = cls;
      b.innerHTML = ICON[ic] + `<span>${label}</span>`; b.onclick = fn; menu.appendChild(b);
    });
    panel({ title: '/' + slug, sub: `${l.clicks} click${l.clicks === 1 ? '' : 's'} · goes to ${bare(l.url)}`, body: menu });
  }

  async function editLink(slug) {
    const l = links.find((x) => x.slug === slug);
    const wrap = document.createElement('div'); wrap.className = 'field';
    wrap.innerHTML = '<label for="editUrl">New destination</label><input id="editUrl" class="input" type="text" inputmode="url">';
    const input = wrap.querySelector('input'); input.value = l.url;
    input.addEventListener('keydown', (e) => { if (e.key === 'Enter') $('pBtns').lastChild.click(); });
    const v = await panel({
      title: 'Change /' + slug, sub: 'The short link stays the same. Only where it goes changes.', body: wrap, center: true,
      buttons: [{ label: 'Cancel', value: null }, { label: 'Save', cls: 'primary', value: () => input.value }],
    });
    if (v == null) return;
    try { await api('POST', '/api/links', { url: v, slug, overwrite: true }); toast('Saved'); await load(); }
    catch (e) { toast(e.message); }
  }

  async function deleteLink(slug) {
    const ok = await panel({
      title: 'Delete /' + slug + '?', center: true,
      sub: 'Anyone who opens this link afterward will see a “not found” page. You can’t undo this.',
      buttons: [{ label: 'Keep it', value: false }, { label: 'Delete', cls: 'danger', value: true }],
    });
    if (!ok) return;
    try {
      await api('DELETE', `/api/links?slug=${encodeURIComponent(slug)}`);
      if (current === slug) $('tagzone').classList.remove('show');
      toast('Deleted'); await load();
    } catch (e) { toast(e.message); }
  }

  $('rows').addEventListener('click', (e) => { const r = e.target.closest('.row'); if (r) rowMenu(r.dataset.slug); });
  $('rows').addEventListener('keydown', (e) => {
    if (e.key !== 'Enter' && e.key !== ' ') return;
    const r = e.target.closest('.row'); if (r) { e.preventDefault(); rowMenu(r.dataset.slug); }
  });
  $('search').addEventListener('input', render);

  // ---------- create ----------
  function showTag(slug, url) {
    current = slug;
    $('tagHost').textContent = HOST + '/';
    $('tagSlug').textContent = slug;
    $('tagDest').textContent = 'Goes to ' + bare(url);
    const z = $('tagzone'); z.classList.remove('show'); void z.offsetWidth; z.classList.add('show');
  }

  $('createForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    $('createError').textContent = '';
    const btn = $('createBtn'); btn.disabled = true; btn.textContent = 'Shortening…';
    const payload = { url: $('url').value, slug: $('slug').value };
    try {
      let d;
      try { d = await api('POST', '/api/links', payload); }
      catch (err) {
        if (err.status !== 409) throw err;
        const replace = await panel({
          title: '/' + err.data.slug + ' is taken', center: true,
          sub: 'It already points somewhere else. Replace it with this link, or go back and pick another name.',
          buttons: [{ label: 'Pick another', value: false }, { label: 'Replace', cls: 'danger', value: true }],
        });
        if (!replace) { $('slug').focus(); $('slug').select(); return; }
        d = await api('POST', '/api/links', { ...payload, overwrite: true });
      }
      showTag(d.slug, d.url);
      $('url').value = ''; $('slug').value = '';
      copy(full(d.slug), 'Copied to your clipboard');
      await load();
    } catch (err) {
      $('createError').textContent = err.message;
    } finally {
      btn.disabled = false; btn.textContent = 'Shorten';
    }
  });

  $('tagCopy').onclick = () => copy(full(current));
  $('tagShare').onclick = () => share(current);
  $('tagQr').onclick = () => qrFor(current);

  // ---------- auth ----------
  function showApp() {
    $('loginView').classList.add('hidden'); $('appView').classList.remove('hidden');
    $('slugHost').textContent = HOST + '/';
  }
  function showLogin(msg = '') {
    $('appView').classList.add('hidden'); $('loginView').classList.remove('hidden');
    $('loginError').textContent = msg; setTimeout(() => $('pw').focus(), 60);
  }
  async function tryKey(key) {
    KEY = key;
    try { await load(); store.set('l33_key', key); showApp(); }
    catch (e) {
      KEY = '';
      if (e.status === 401) { store.del('l33_key'); showLogin(key ? 'That password didn’t work. Try again.' : ''); }
      else showLogin(e.message);
    }
  }
  $('loginForm').addEventListener('submit', (e) => { e.preventDefault(); tryKey($('pw').value); });
  $('logoutBtn').onclick = () => { store.del('l33_key'); KEY = ''; $('pw').value = ''; showLogin(); };

  const saved = store.get('l33_key') || store.get('sl_key');
  if (saved) tryKey(saved); else showLogin();
})();
</script>
</body>
</html>
